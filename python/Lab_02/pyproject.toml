[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "restaurant-lab-02"
version = "0.2.0"
description = "Restaurant orders laboratory 2"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "SQLAlchemy>=2.0", "alembic>=1.13", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "numpy>=2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.13", "types-PyYAML", "build>=1.2"]
[project.scripts]
restaurant-demo = "restaurant_manager.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
